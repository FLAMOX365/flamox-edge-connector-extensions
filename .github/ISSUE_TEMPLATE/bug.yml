name: Extension bug report
description: Report a reproducible extension defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, customer data, device identifiers, or
        vulnerability details. Use the private security-reporting link in the
        issue chooser for security-sensitive reports.
  - type: input
    id: extension
    attributes:
      label: Extension and version
      placeholder: telephony.fritzbox 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Edge Connector commit, Node.js version, OS, and device or protocol version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this defect.
          required: true
        - label: I removed credentials, private configuration, customer data, and device identifiers.
          required: true
        - label: This is not a vulnerability report.
          required: true
